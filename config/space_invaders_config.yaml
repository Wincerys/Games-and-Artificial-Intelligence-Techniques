behaviors:
  SpaceInvadersAgent:
    trainer_type: ppo
    
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
        
    keep_checkpoints: 5
    max_steps: 1000000
    time_horizon: 1000
    summary_freq: 10000